<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Cost Waste Analyzer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 1.5rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.875rem; margin-top: 4px; }
    .login-box {
      max-width: 400px;
      margin: 80px auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      margin-bottom: 16px;
      font-size: 0.95rem;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .btn-primary { background: var(--accent); color: white; width: 100%; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-sm { padding: 6px 10px; font-size: 0.75rem; margin-right: 4px; }
    .btn-pro { background: var(--success); color: #052e16; }
    .btn-revoke { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .stat .n { font-size: 1.75rem; font-weight: 700; }
    .stat .l { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .toolbar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .toolbar input { margin: 0; flex: 1; min-width: 200px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; background: #0f172a; position: sticky; top: 0; }
    tr:hover td { background: rgba(99, 102, 241, 0.08); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge-pro { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge-free { background: rgba(148, 163, 184, 0.15); color: var(--muted); }
    .err { color: var(--danger); font-size: 0.85rem; margin-top: 8px; }
    .hidden { display: none !important; }
    .table-scroll { overflow-x: auto; max-height: 70vh; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 90%; max-width: 420px;
    }
    .modal h2 { font-size: 1.1rem; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    a { color: var(--accent-hover); }
  </style>
</head>
<body>
  <div id="loginView" class="wrap">
    <div class="login-box">
      <h1>Admin CWA</h1>
      <p class="sub" style="margin-bottom: 24px;">Cost Waste Analyzer · HubSpot Marketplace</p>
      <form id="loginForm">
        <label for="email">Correo admin</label>
        <input id="email" type="email" autocomplete="username" required />
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button type="submit" class="btn-primary">Entrar</button>
        <p id="loginError" class="err hidden"></p>
      </form>
    </div>
  </div>

  <div id="dashView" class="wrap hidden">
    <div class="header">
      <div>
        <h1>Dashboard de clientes</h1>
        <p class="sub">Portales HubSpot conectados · activación Pro manual</p>
      </div>
      <button type="button" class="btn-ghost btn-sm" id="logoutBtn">Cerrar sesión</button>
    </div>

    <div class="stats" id="statsRow"></div>

    <div class="card">
      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Buscar portal, dominio, email…" />
        <select id="filterPro">
          <option value="all">Todos</option>
          <option value="pro">Solo Pro</option>
          <option value="free">Solo Free</option>
        </select>
        <button type="button" class="btn-ghost btn-sm" id="refreshBtn">Actualizar</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Portal ID</th>
              <th>Cuenta / dominio</th>
              <th>Email instalador</th>
              <th>Último usuario</th>
              <th>Plan</th>
              <th>Scans</th>
              <th>Última actividad</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="portalsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="modalPro" class="modal-bg hidden">
    <div class="modal">
      <h2>Activar Pro</h2>
      <p class="sub" id="modalPortalLabel"></p>
      <label>Días de vigencia</label>
      <input type="number" id="proDays" value="365" min="1" max="3650" />
      <label>Email (opcional, referencia)</label>
      <input type="email" id="proEmail" placeholder="cliente@empresa.com" />
      <div class="modal-actions">
        <button type="button" class="btn-ghost btn-sm" id="modalCancel">Cancelar</button>
        <button type="button" class="btn-pro btn-sm" id="modalConfirm">Activar</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "cwa_admin_token";
    let allPortals = [];
    let modalPortalId = null;

    function token() {
      return localStorage.getItem(STORAGE_KEY);
    }

    function setToken(t) {
      if (t) localStorage.setItem(STORAGE_KEY, t);
      else localStorage.removeItem(STORAGE_KEY);
    }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      const t = token();
      if (t) headers.Authorization = "Bearer " + t;
      const res = await fetch(path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        setToken(null);
        showLogin();
        throw new Error(data.message || "Sesión expirada");
      }
      if (!res.ok) throw new Error(data.message || data.error || res.statusText);
      return data;
    }

    function showLogin() {
      document.getElementById("loginView").classList.remove("hidden");
      document.getElementById("dashView").classList.add("hidden");
    }

    function showDash() {
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("dashView").classList.remove("hidden");
    }

    function fmtDate(v) {
      if (!v) return "—";
      try {
        return new Date(v).toLocaleString("es-PE", { dateStyle: "short", timeStyle: "short" });
      } catch {
        return String(v);
      }
    }

    function renderStats(stats) {
      const items = [
        { n: stats.totalPortals, l: "Portales conectados" },
        { n: stats.proActive, l: "Con Pro activo" },
        { n: stats.freePortals, l: "Plan Free" },
        { n: stats.withEmail, l: "Con email registrado" },
        { n: stats.scansLast7d, l: "Scans (7 días)" },
        { n: stats.activeLast30d ?? "—", l: "Activos (30 días)" }
      ];
      document.getElementById("statsRow").innerHTML = items
        .map((s) => `<div class="stat"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>`)
        .join("");
    }

    function filteredPortals() {
      const q = (document.getElementById("searchInput").value || "").toLowerCase();
      const f = document.getElementById("filterPro").value;
      return allPortals.filter((p) => {
        if (f === "pro" && !p.proActive) return false;
        if (f === "free" && p.proActive) return false;
        if (!q) return true;
        const hay = [
          p.portalId,
          p.hubDomain,
          p.accountName,
          p.installerEmail,
          p.lastUserEmail,
          p.lastUserName
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
        return hay.includes(q);
      });
    }

    function renderTable() {
      const rows = filteredPortals();
      const tbody = document.getElementById("portalsBody");
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--muted)">Sin resultados</td></tr>';
        return;
      }
      tbody.innerHTML = rows
        .map((p) => {
          const plan = p.proActive
            ? `<span class="badge badge-pro">Pro · ${fmtDate(p.proExpiresAt)}</span>`
            : `<span class="badge badge-free">Free</span>`;
          const domain = p.hubDomain
            ? `<a href="https://${p.hubDomain}" target="_blank" rel="noopener">${p.hubDomain}</a>`
            : "—";
          const account = p.accountName ? `<br><span style="color:var(--muted)">${p.accountName}</span>` : "";
          return `<tr>
            <td><strong>${p.portalId}</strong></td>
            <td>${domain}${account}</td>
            <td>${p.installerEmail || "—"}</td>
            <td>${p.lastUserEmail || "—"}${p.lastUserName ? `<br><span style="color:var(--muted)">${p.lastUserName}</span>` : ""}</td>
            <td>${plan}</td>
            <td>${p.scanCount}</td>
            <td>${fmtDate(p.lastSeenAt || p.lastScanAt || p.installedAt)}</td>
            <td>
              ${p.proActive
                ? `<button class="btn-sm btn-revoke" data-revoke="${p.portalId}">Quitar Pro</button>`
                : `<button class="btn-sm btn-pro" data-activate="${p.portalId}" data-email="${p.installerEmail || p.lastUserEmail || ""}">Activar Pro</button>`}
            </td>
          </tr>`;
        })
        .join("");

      tbody.querySelectorAll("[data-activate]").forEach((btn) => {
        btn.addEventListener("click", () => openProModal(btn.dataset.activate, btn.dataset.email));
      });
      tbody.querySelectorAll("[data-revoke]").forEach((btn) => {
        btn.addEventListener("click", () => revokePro(btn.dataset.revoke));
      });
    }

    function openProModal(portalId, email) {
      modalPortalId = portalId;
      document.getElementById("modalPortalLabel").textContent = "Portal " + portalId;
      document.getElementById("proEmail").value = email || "";
      document.getElementById("modalPro").classList.remove("hidden");
    }

    async function loadDashboard() {
      const data = await api("/api/admin/dashboard");
      allPortals = data.portals || [];
      renderStats(data.stats || {});
      renderTable();
    }

    async function revokePro(portalId) {
      if (!confirm("¿Revocar Pro del portal " + portalId + "?")) return;
      await api("/api/admin/portals/" + encodeURIComponent(portalId) + "/revoke-pro", {
        method: "POST",
        body: "{}"
      });
      await loadDashboard();
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("loginError");
      errEl.classList.add("hidden");
      try {
        const res = await api("/api/admin/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });
        setToken(res.token);
        showDash();
        await loadDashboard();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove("hidden");
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      setToken(null);
      showLogin();
    });

    document.getElementById("refreshBtn").addEventListener("click", () => loadDashboard().catch(alert));
    document.getElementById("searchInput").addEventListener("input", renderTable);
    document.getElementById("filterPro").addEventListener("change", renderTable);

    document.getElementById("modalCancel").addEventListener("click", () => {
      document.getElementById("modalPro").classList.add("hidden");
      modalPortalId = null;
    });

    document.getElementById("modalConfirm").addEventListener("click", async () => {
      if (!modalPortalId) return;
      try {
        await api("/api/admin/portals/" + encodeURIComponent(modalPortalId) + "/activate-pro", {
          method: "POST",
          body: JSON.stringify({
            days: Number(document.getElementById("proDays").value) || 365,
            email: document.getElementById("proEmail").value || undefined
          })
        });
        document.getElementById("modalPro").classList.add("hidden");
        modalPortalId = null;
        await loadDashboard();
        alert("Pro activado correctamente.");
      } catch (err) {
        alert(err.message);
      }
    });

    (async function init() {
      if (!token()) {
        showLogin();
        return;
      }
      try {
        await api("/api/admin/me");
        showDash();
        await loadDashboard();
      } catch {
        showLogin();
      }
    })();
  </script>
</body>
</html>
