<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear todas las listas — CWA</title>
  <style>
    * { box-sizing: border-box; }
    html {
      width: 100%;
      max-width: 100%;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      background: #f5f5f5;
      color: #1a1a1a;
      overflow-x: hidden;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    body.iframe-embed { background: #fff; overflow-y: auto; }
    body.iframe-embed .wrap {
      max-width: none;
      width: 100%;
      padding: 20px 24px 32px;
    }
    h1 { font-size: 1.2rem; color: #0091AE; margin: 0 0 8px; }
    .sub { font-size: 0.88rem; color: #64748b; margin-bottom: 16px; line-height: 1.45; }
    .panel {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      margin-bottom: 16px;
    }
    ul.names {
      margin: 0 0 12px;
      padding-left: 1.2rem;
      font-size: 0.875rem;
      line-height: 1.5;
      max-height: 220px;
      overflow-y: auto;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
    button.primary {
      background: #0091AE;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
    button.secondary {
      background: #e5e7eb;
      color: #334155;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .err { background: #fef2f2; color: #b91c1c; padding: 12px; border-radius: 8px; font-size: 0.9rem; }
    .ok { background: #ecfdf5; color: #047857; padding: 12px; border-radius: 8px; font-size: 0.9rem; }
    .warn { background: #fffbeb; color: #b45309; padding: 12px; border-radius: 8px; font-size: 0.9rem; }
    .loading { padding: 32px; text-align: center; color: #64748b; }
    .result-row { font-size: 0.82rem; padding: 6px 0; border-bottom: 1px solid #f1f5f9; }
    .result-row:last-child { border-bottom: none; }
    a.link { color: #0091AE; font-weight: 500; }
  </style>
</head>
<body>
  <script>
    (function () {
      try {
        if (window.self !== window.top) {
          document.documentElement.classList.add("iframe-embed");
          document.body.classList.add("iframe-embed");
        }
      } catch (_) {
        document.documentElement.classList.add("iframe-embed");
        document.body.classList.add("iframe-embed");
      }
    })();
  </script>
  <div class="wrap" id="root">
    <div class="loading">Cargando…</div>
  </div>
  <script>
    const API = 'https://cwa.estado7.com';

    /**
     * Misma lista que AUDIT_HUBSPOT_LIST_CARDS en SettingsPage y listDefinitions en /api/lists/create
     */
    const AUDIT_LIST_META = [
      { id: 'contacts-without-email', title: 'Contactos sin email' },
      { id: 'contacts-without-phone', title: 'Contactos sin teléfono' },
      { id: 'contacts-without-owner', title: 'Contactos sin owner' },
      { id: 'contacts-inactive-180', title: 'Contactos inactivos +180 días' },
      { id: 'contacts-created-90-no-activity', title: 'Creados +90 días sin actividad' },
      { id: 'contacts-high-risk', title: 'Contactos de alto riesgo' },
      { id: 'deals-without-contact', title: 'Deals sin contacto' },
      { id: 'deals-without-amount', title: 'Deals sin monto' },
      { id: 'deals-without-owner', title: 'Deals sin owner' },
      { id: 'deals-inactive-180', title: 'Deals inactivos +180 días' },
      { id: 'deals-stuck-stage', title: 'Deals estancados por etapa' },
      { id: 'deals-high-risk', title: 'Deals de alto riesgo' },
    ];
    const LIST_IDS = AUDIT_LIST_META.map(function (x) { return x.id; });

    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function titleForId(listId) {
      var m = AUDIT_LIST_META.find(function (x) { return x.id === listId; });
      return m ? m.title : listId;
    }

    function renderConfirm(portalId) {
      var root = document.getElementById('root');
      var items = AUDIT_LIST_META.map(function (x) {
        return '<li>' + esc(x.title) + '</li>';
      }).join('');
      root.innerHTML =
        '<h1>Crear todas las listas de auditoría</h1>' +
        '<p class="sub">Se crearán <strong>' + LIST_IDS.length + '</strong> listas dinámicas en tu cuenta HubSpot, con el prefijo <code>[CWA]</code> en el nombre. Es el mismo criterio que al usar «Crear lista» en cada tarjeta de la app.</p>' +
        '<div class="panel">' +
        '<p style="margin:0 0 8px;font-size:0.9rem;font-weight:600;">Listas incluidas</p>' +
        '<ul class="names">' + items + '</ul>' +
        '<p class="sub" style="margin:0;">Si una lista ya existe o HubSpot devuelve límite de la cuenta, esa entrada fallará; podrás crearla después desde la tarjeta individual.</p>' +
        '</div>' +
        '<div class="actions">' +
        '<button type="button" class="primary" id="btnConfirm">Confirmar y crear en HubSpot</button>' +
        '</div>' +
        '<p class="sub" style="margin-top:12px;">Portal: <code>' + esc(portalId) + '</code></p>';

      document.getElementById('btnConfirm').addEventListener('click', function () {
        runCreateAll(portalId);
      });
    }

    function runCreateAll(portalId) {
      var root = document.getElementById('root');
      root.innerHTML = '<div class="loading">Creando listas en HubSpot…<br/><span style="font-size:0.85rem">Puede tardar un minuto. No cierres esta ventana.</span></div>';

      var payload = JSON.stringify({ portalId: String(portalId), listIds: LIST_IDS });

      fetch(API + '/api/lists/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: payload,
      })
        .then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, status: res.status, data: data };
          });
        })
        .then(function (out) {
          if (!out.ok) {
            var msg = (out.data && (out.data.message || out.data.error)) || ('Error HTTP ' + out.status);
            showError(msg, out.data);
            return;
          }
          showResults(out.data, portalId);
        })
        .catch(function (e) {
          showError(e.message || 'Error de red', null);
        });
    }

    function showError(message, data) {
      var root = document.getElementById('root');
      var extra = '';
      if (data && data.debug) {
        extra = '<pre style="font-size:11px;overflow:auto;">' + esc(JSON.stringify(data.debug, null, 2)) + '</pre>';
      }
      root.innerHTML =
        '<h1>No se pudo completar</h1>' +
        '<div class="err">' + esc(message) + '</div>' +
        extra +
        '<div class="actions"><button type="button" class="secondary" id="btnRetry">Volver al inicio</button></div>';
      document.getElementById('btnRetry').addEventListener('click', function () {
        var p = new URLSearchParams(window.location.search).get('portalId');
        if (p) renderConfirm(p);
      });
    }

    function showResults(data, portalId) {
      var root = document.getElementById('root');
      var created = data.created != null ? data.created : 0;
      var failed = data.failed != null ? data.failed : 0;
      var results = data.results || [];
      var bannerClass = failed === 0 ? 'ok' : 'warn';
      var bannerText =
        failed === 0
          ? 'Se crearon ' + created + ' listas correctamente.'
          : 'Creadas: ' + created + '. Con incidencias: ' + failed + '.';

      var rows = results
        .map(function (r) {
          var line = '';
          if (r.success && r.url) {
            line =
              '<div class="result-row">✓ ' +
              esc(titleForId(r.listId)) +
              ' — <a class="link" href="' +
              esc(r.url) +
              '" target="_blank" rel="noopener">Abrir</a></div>';
          } else {
            line =
              '<div class="result-row">✗ ' +
              esc(titleForId(r.listId)) +
              ' — ' +
              esc(r.error || 'Error') +
              '</div>';
          }
          return line;
        })
        .join('');

      root.innerHTML =
        '<h1>Resultado</h1>' +
        '<div class="' +
        bannerClass +
        '">' +
        esc(bannerText) +
        '</div>' +
        '<p class="sub">Busca las listas en CRM → Listas (filtro por nombre <code>[CWA]</code>).</p>' +
        '<div class="panel" style="margin-top:12px;">' +
        rows +
        '</div>' +
        '<div class="actions"><button type="button" class="secondary" id="btnAgain">Cerrar</button></div>';

      document.getElementById('btnAgain').addEventListener('click', function () {
        var p = new URLSearchParams(window.location.search).get('portalId');
        if (p) renderConfirm(p);
      });
    }

    (function init() {
      var params = new URLSearchParams(window.location.search);
      var portalId = params.get('portalId');
      var root = document.getElementById('root');
      if (!portalId) {
        root.innerHTML = '<div class="err">Falta portalId en la URL.</div>';
        return;
      }
      renderConfirm(portalId);
    })();
  </script>
</body>
</html>
